name: Actualizar noticias

# El cron de GitHub Actions ("schedule") no es confiable para intervalos
# cortos: en la practica, GitHub puede posponer estas corridas varias
# horas, sobre todo en repos publicos con poca actividad. Por eso un
# servicio externo (cron-job.org) llama cada 30 minutos al endpoint de
# la API de GitHub "Create a workflow dispatch event", que dispara este
# mismo workflow via el evento workflow_dispatch de abajo. El cron
# interno queda solo como respaldo, una vez por hora, en un minuto que
# no es ni :00 ni :30 (para evitar el momento de mas congestion).
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar data.json
        run: python fetch_news.py

      - name: Commitear cambios (solo si hay noticias nuevas)
        run: |
          git config user.name "noticias-rosario-bot"
          git config user.email "noticias-rosario-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
