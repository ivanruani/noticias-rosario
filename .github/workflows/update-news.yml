name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar data.json
        run: python fetch_news.py

      - name: Commitear cambios (solo si hay noticias nuevas)
        run: |
          git config user.name "noticias-rosario-bot"
          git config user.email "noticias-rosario-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
